name: steamdeals

# 国内部署：腾讯云 TCR 个人版 + 自带 PostgreSQL。
#
#   docker compose -f compose.cn.yaml up -d
#
# 镜像已放在腾讯云 TCR 公开仓库，国内拉取不依赖 Docker Hub。
# 首次打开 http://服务器IP:8090 会进入 /setup 初始化页。

services:
  db:
    image: ccr.ccs.tencentyun.com/tcb-100003189690-pljp/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: steamdeals
      POSTGRES_USER: steamdeals
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamdeals -d steamdeals"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: ccr.ccs.tencentyun.com/tcb-100003189690-pljp/steamdeals:latest
    restart: unless-stopped
    # EV 批（docs/SCHEDULER-AS-SERVICE.md）：只跑 Web/API；调度器独立成 scheduler 服务
    command: ["serve"]
    ports:
      - "${WEB_PORT:-8090}:8080"
    environment:
      DATABASE_URL: postgres://steamdeals@db:5432/steamdeals
      TZ: ${TZ:-Asia/Shanghai}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      RATE_LIMIT_PAGE_MAX: ${RATE_LIMIT_PAGE_MAX:-120}
      RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-150}
      RATE_LIMIT_ASSET_MAX: ${RATE_LIMIT_ASSET_MAX:-300}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - logs:/app/logs
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "src/cli.js", "ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # EV 批（docs/SCHEDULER-AS-SERVICE.md）：独立调度器服务——与 app 同镜像，command 空 →
  # entrypoint 按 RUN_MODE=scheduler 跑 node src/scheduler.js；与 app 共享 appdata/logs 卷。
  scheduler:
    image: ccr.ccs.tencentyun.com/tcb-100003189690-pljp/steamdeals:latest
    restart: unless-stopped
    command: []
    environment:
      DATABASE_URL: postgres://steamdeals@db:5432/steamdeals
      TZ: ${TZ:-Asia/Shanghai}
      RUN_MODE: scheduler
      # 采集开关/代理/告警等配置与 app 同源：按需在此追加（如 STEAM_API_KEY / STEAM_PROXY）
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - logs:/app/logs
    stop_grace_period: 10m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  appdata:
  logs:
