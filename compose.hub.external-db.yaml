name: steamdeals

# Docker Hub 部署：使用你已有的 PostgreSQL，不启动 db 容器。
#
#   1. 改下面 environment.DATABASE_URL 为你的连接串
#   2. docker compose -f compose.hub.external-db.yaml up -d
#
# 数据库地址直接写在 compose 文件里，不需要创建/编辑 .env。
# 宿主机上的 PostgreSQL 用 host.docker.internal（Linux 已映射到网关）；
# 跨机器务必加 ?sslmode=require。
#
# 首次打开 http://服务器IP:8090 会进入 /setup 初始化页。

services:
  app:
    image: s1065420329/steamdeals:latest
    restart: unless-stopped
    # EV 批（docs/SCHEDULER-AS-SERVICE.md）：只跑 Web/API；调度器独立成 scheduler 服务
    command: ["serve"]
    ports:
      - "${WEB_PORT:-8090}:8080"
    environment:
      # 直接改下面这一行即可，不需要 .env，也不需要命令行传变量。
      # 这是 Compose 的 environment 配置，和 volumes 一样属于 compose 文件内容。
      #
      # 注意：
      #   · 密码里的 # ? / @ 等 URL 特殊字符需要 URL 编码（# → %23，? → %3F，/ → %2F，@ → %40）
      #   · 真实密码不要提交到公开仓库；可以复制成 compose.hub.external-db.local.yaml（已 gitignore）
      DATABASE_URL: "postgres://user:password@host:5432/steamdeals?sslmode=require"
      TZ: ${TZ:-Asia/Shanghai}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      RATE_LIMIT_PAGE_MAX: ${RATE_LIMIT_PAGE_MAX:-120}
      RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-150}
      RATE_LIMIT_ASSET_MAX: ${RATE_LIMIT_ASSET_MAX:-300}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
      - logs:/app/logs
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "src/cli.js", "ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # EV 批（docs/SCHEDULER-AS-SERVICE.md）：独立调度器服务——与 app 同镜像，command 空 →
  # entrypoint 按 RUN_MODE=scheduler 跑 node src/scheduler.js；与 app 共享 appdata/logs 卷。
  # 外部库模式没有 db service，DATABASE_URL 与 app 保持一致（改 app 那行时这里同步改）。
  scheduler:
    image: s1065420329/steamdeals:latest
    restart: unless-stopped
    command: []
    environment:
      DATABASE_URL: "postgres://user:password@host:5432/steamdeals?sslmode=require"
      TZ: ${TZ:-Asia/Shanghai}
      RUN_MODE: scheduler
      # 采集开关/代理/告警等配置与 app 同源：按需在此追加（如 STEAM_API_KEY / STEAM_PROXY）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
      - logs:/app/logs
    stop_grace_period: 10m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  appdata:
  logs:
