<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>更换邮箱对话框 demo</title>
<style>
  :root{--bg:#0b1020;--panel:#121a30;--border:#243050;--border-2:#2e3d63;--fg:#e8edf9;--fg-muted:#93a0bf;--fg-subtle:#6d7a99;--brand:#6b7dff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.65 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
  .page{filter:blur(1px);opacity:.45;pointer-events:none}
  .crumb{color:var(--fg-subtle);font-size:11.5px;margin-bottom:5px}
  h1{font-size:19px;margin:0 0 12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;max-width:760px}
  .row{display:flex;gap:10px;padding:8px 0;border-top:1px dashed #1c2740;align-items:center}
  .row:first-child{border-top:0}
  .row label{width:90px;color:var(--fg-muted);font-size:12.5px}
  .val{flex:1;color:var(--fg)}
  .overlay{position:fixed;inset:0;background:rgba(4,8,18,.6);display:flex;align-items:center;justify-content:center;padding:20px}
  .dialog{width:520px;max-width:94vw;background:linear-gradient(180deg,#131c31,#101728);border:1px solid var(--border-2);border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
  .d-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:#0f1729}
  .d-head h3{font-size:14px;margin:0;flex:1}
  .d-head .x{color:var(--fg-subtle);font-size:16px}
  .d-body{padding:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11.5px;color:var(--fg-muted);margin-bottom:5px}
  .input{display:flex;gap:8px}
  .input .box{flex:1;background:#0d1526;border:1px solid var(--border-2);border-radius:9px;padding:8px 11px;font-size:12.5px;color:var(--fg)}
  .input .box.ro{color:var(--fg-subtle);background:#0b1222}
  .btn{border:1px solid var(--border-2);background:#0f1728;color:var(--fg);border-radius:9px;padding:6px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .btn-primary{background:linear-gradient(180deg,#7287ff,#5a6bf5);border-color:#6b7dff;color:#fff;font-weight:600}
  .hint{color:var(--fg-subtle);font-size:10.5px;margin-top:4px}
  .warn{background:#2a2113;border:1px solid #5a4520;color:#ffe3b8;border-radius:9px;padding:8px 10px;font-size:11.5px;margin-bottom:12px}
  .d-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 16px;border-top:1px solid var(--border);background:#0e1626}
  .step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-subtle);margin-bottom:12px}
  .step .dot{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
  .step .dot.off{background:#26334f;color:#93a3c4}
</style>
</head>
<body>
  <div class="page">
    <div class="crumb">管理中心 / 账号与服务 / 个人资料</div>
    <h1>个人资料</h1>
    <div class="card">
      <div class="row"><label>昵称</label><div class="val">超级管理员</div></div>
      <div class="row"><label>邮箱</label><div class="val">admin@example.com（已验证）　<button class="btn">更换邮箱</button></div></div>
      <div class="row"><label>角色</label><div class="val">管理员</div></div>
    </div>
  </div>

  <div class="overlay">
    <div class="dialog">
      <div class="d-head"><h3>更换登录邮箱</h3><span class="x">✕</span></div>
      <div class="d-body">
        <div class="step"><span class="dot">1</span>验证新邮箱 <span style="color:#3a4c86">——</span> <span class="dot off">2</span>确认完成</div>
        <div class="warn">更换成功后，<b>所有设备会退出登录</b>，需要用新邮箱重新登录；旧邮箱会收到安全通知。</div>
        <div class="field"><label>当前邮箱</label><div class="input"><div class="box ro">admin@example.com</div></div></div>
        <div class="field"><label>新邮箱</label>
          <div class="input"><div class="box">new-mail@example.com</div><button class="btn">发送验证码</button></div>
          <div class="hint">验证码发送后 10 分钟内有效；每天最多更换 1 次</div>
        </div>
        <div class="field"><label>验证码</label>
          <div class="input"><div class="box">8 4 2 1 9 3</div><button class="btn">重新发送（58s）</button></div>
          <div class="hint">已发送到 new-mail@example.com，5 次尝试机会</div>
        </div>
      </div>
      <div class="d-foot"><button class="btn">取消</button><button class="btn btn-primary">确认更换</button></div>
    </div>
  </div>
</body>
</html>
