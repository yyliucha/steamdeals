<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>个人资料（Android）demo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#1b1b1f;display:flex;justify-content:center;padding:20px;font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .phone{width:392px;height:824px;background:#f7f5fb;border-radius:34px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6);position:relative}
  .status{display:flex;justify-content:space-between;padding:10px 20px 2px;color:#3a3550;font-size:11px}
  .bar{display:flex;align-items:center;gap:14px;padding:8px 16px 10px}
  .back{font-size:20px;color:#3a3550}
  .bar h1{font-size:17px;margin:0;color:#241f38;font-weight:600}
  .content{padding:4px 16px 96px}
  .avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 18px}
  .avatar{width:96px;height:96px;border-radius:50%;background:center/cover no-repeat,linear-gradient(135deg,#cfc3f5,#8d7bd8);position:relative;border:2px solid #fff;box-shadow:0 6px 18px rgba(107,125,255,.25)}
  .avatar .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#6750d8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #f7f5fb}
  .avatar-wrap .tip{font-size:11px;color:#8a83a3}
  .card{background:#fff;border-radius:16px;padding:4px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(36,31,56,.06)}
  .row{padding:12px 0;border-bottom:1px solid #efeaf7}
  .row:last-child{border-bottom:0}
  .row .k{font-size:11px;color:#8a83a3;margin-bottom:3px}
  .row .v{font-size:14px;color:#241f38}
  .row .v.muted{color:#8a83a3}
  .row .v .lock{font-size:11px;color:#8a83a3;margin-left:6px}
  .counter{font-size:10.5px;color:#8a83a3;text-align:right;margin-top:2px}
  .sec{font-size:12px;color:#8a83a3;margin:14px 2px 6px}
  .steam{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #efeaf7}
  .steam:last-child{border-bottom:0}
  .steam img{width:30px;height:30px;border-radius:8px;background:#e8e2f5}
  .steam .n{flex:1;font-size:13.5px;color:#241f38}
  .steam .id{font-size:11px;color:#8a83a3}
  .btnbar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;background:linear-gradient(180deg,rgba(247,245,251,0),#f7f5fb 30%)}
  .save{width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(180deg,#7b65e8,#5f49d3);box-shadow:0 8px 20px rgba(95,73,211,.3)}
.avatar .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff}.sav{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#7b65e8,#5f49d3);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
</style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>08:12</span><span>5G ▮▮▮ 100</span></div>
    <div class="bar"><span class="back">←</span><h1>编辑资料</h1></div>
    <div class="content">
      <div class="avatar-wrap">
        <div class="avatar"><span class="ini">S</span><span class="cam">📷</span></div>
        <span class="tip">点击更换头像 · 自动裁剪 256×256</span>
      </div>

      <div class="card">
        <div class="row"><div class="k">昵称</div><div class="v">超级管理员</div></div>
        <div class="row"><div class="k">用户名</div><div class="v muted">admin<span class="lock">🔒 不可修改</span></div></div>
        <div class="row"><div class="k">邮箱</div><div class="v muted">admin@example.com<span class="lock">🔒 已验证</span></div></div>
      </div>

      <div class="sec">个人简介</div>
      <div class="card">
        <div class="row" style="padding-bottom:6px"><div class="v" style="font-size:13.5px;color:#4a4363">Steam 老玩家，喜欢策略与 RPG。</div><div class="counter">23 / 200</div></div>
      </div>

      <div class="sec">偏好与通知</div>
      <div class="card">
        <div class="row"><div class="k">主题</div><div class="v">跟随系统</div></div>
        <div class="row"><div class="k">到价提醒邮件</div><div class="v">开启</div></div>
      </div>

      <div class="sec">Steam 绑定账号（只读）</div>
      <div class="card">
        <div class="steam"><span class="sav">s</span><div class="n">sunming</div><div class="id">76561198…1234</div></div>
        <div class="steam"><span class="sav">s</span><div class="n">alt_account</div><div class="id">76561198…5678</div></div>
      </div>
    </div>
    <div class="btnbar"><button class="save">保存修改</button></div>
  </div>
</body>
</html>
