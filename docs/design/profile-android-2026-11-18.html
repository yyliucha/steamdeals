<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>个人资料（Android）demo v2</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#1b1b1f;display:flex;justify-content:center;padding:20px;font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .phone{width:392px;height:900px;background:#f7f5fb;border-radius:34px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6);position:relative}
  .status{display:flex;justify-content:space-between;padding:10px 20px 2px;color:#3a3550;font-size:11px}
  .bar{display:flex;align-items:center;gap:14px;padding:8px 16px 10px}
  .back{font-size:20px;color:#3a3550}
  .bar h1{font-size:17px;margin:0;color:#241f38;font-weight:600}
  .content{padding:2px 16px 96px;height:calc(100% - 78px);overflow:auto}
  .avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 12px}
  .avatar{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#7b65e8,#5f49d3);position:relative;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;border:2px solid #fff;box-shadow:0 6px 18px rgba(107,125,255,.25)}
  .avatar .cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:#6750d8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #f7f5fb}
  .avatar-wrap .tip{font-size:11px;color:#8a83a3}
  .avopts{display:flex;gap:8px;margin-top:6px}
  .avopt{display:flex;align-items:center;gap:6px;border:1px solid #e2daf3;background:#fff;border-radius:999px;padding:4px 10px;font-size:11px;color:#8a83a3}
  .avopt.on{border-color:#6750d8;color:#3a2f6b;box-shadow:0 0 0 3px rgba(103,80,216,.12)}
  .avopt .dot{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#7b65e8,#5f49d3);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:16px;padding:2px 14px;margin-bottom:11px;box-shadow:0 1px 2px rgba(36,31,56,.06)}
  .row{padding:11px 0;border-bottom:1px solid #efeaf7}
  .row:last-child{border-bottom:0}
  .row .k{font-size:11px;color:#8a83a3;margin-bottom:2px}
  .row .v{font-size:14px;color:#241f38}
  .row .v.muted{color:#8a83a3}
  .row .v .lock{font-size:11px;color:#8a83a3;margin-left:6px}
  .counter{font-size:10.5px;color:#8a83a3;text-align:right;margin-top:2px}
  .sec{font-size:12px;color:#8a83a3;margin:12px 2px 5px;display:flex;align-items:center;gap:8px}
  .sec .cnt{font-size:10.5px;color:#8a83a3;border:1px solid #e2daf3;border-radius:999px;padding:0 7px;background:#fff}
  .steam{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #efeaf7}
  .steam:last-of-type{border-bottom:0}
  .sav{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#7b65e8,#5f49d3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
  .steam .n{flex:1;min-width:0}
  .steam .n b{font-size:13.5px;color:#241f38;font-weight:600}
  .steam .id{font-size:11px;color:#8a83a3}
  .def{font-size:9.5px;color:#2f7d52;border:1px solid #bfe3cd;background:#eefaf2;border-radius:999px;padding:0 6px;margin-left:4px}
  .op{font-size:11.5px;color:#6750d8;padding:5px 8px;border:1px solid #ded4f7;border-radius:8px;background:#fbf9ff}
  .op.warn{color:#b4433f;border-color:#f2d3d2;background:#fff8f8}
  .add{width:100%;border:1px dashed #c8b8f0;background:#fff;color:#6750d8;border-radius:12px;padding:10px;font-size:13px;margin-top:6px}
  .hint{font-size:10.5px;color:#8a83a3;padding:6px 0 2px}
  .btnbar{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 16px;background:linear-gradient(180deg,rgba(247,245,251,0),#f7f5fb 30%)}
  .save{width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(180deg,#7b65e8,#5f49d3);box-shadow:0 8px 20px rgba(95,73,211,.3)}
</style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>08:12</span><span>5G ▮▮▮ 100</span></div>
    <div class="bar"><span class="back">←</span><h1>编辑资料</h1></div>
    <div class="content">
      <div class="avatar-wrap">
        <div class="avatar">S<span class="cam">📷</span></div>
        <span class="tip">默认头像 · 可切换为任一 Steam 账号或自定义</span>
        <div class="avopts">
          <span class="avopt on"><span class="dot">s</span>sunming</span>
          <span class="avopt"><span class="dot">a</span>alt_account</span>
          <span class="avopt"><span class="dot">↑</span>自定义</span>
        </div>
      </div>

      <div class="card">
        <div class="row"><div class="k">昵称</div><div class="v">超级管理员</div></div>
        <div class="row"><div class="k">用户名</div><div class="v muted">admin<span class="lock">🔒 不可修改</span></div></div>
        <div class="row"><div class="k">邮箱</div><div class="v muted">admin@example.com<span class="lock">🔒 已验证</span></div></div>
      </div>

      <div class="sec">个人简介</div>
      <div class="card"><div class="row" style="padding-bottom:4px"><div class="v" style="font-size:13.5px;color:#4a4363">Steam 老玩家，喜欢策略与 RPG。</div><div class="counter">23 / 200</div></div></div>

      <div class="sec">Steam 绑定账号 <span class="cnt">2 个</span></div>
      <div class="card">
        <div class="steam"><span class="sav">s</span><div class="n"><b>sunming</b><span class="def">默认</span><div class="id">76561198…1234</div></div><span class="op">解绑</span></div>
        <div class="steam"><span class="sav">a</span><div class="n"><b>alt_account</b><div class="id">76561198…5678</div></div><span class="op">设为默认</span><span class="op warn">解绑</span></div>
        <button class="add">＋ 绑定新的 Steam 账号</button>
        <div class="hint">解绑只停止后续检测，历史「曾拥有」记录保留。</div>
      </div>

      <div class="sec">偏好与通知</div>
      <div class="card">
        <div class="row"><div class="k">主题</div><div class="v">跟随系统</div></div>
        <div class="row"><div class="k">到价提醒邮件</div><div class="v">开启</div></div>
      </div>
    </div>
    <div class="btnbar"><button class="save">保存修改</button></div>
  </div>
</body>
</html>
